<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <table width="100%" height="300">
        <tr>
            <td align="center" valign="middle">
                <h3>Inicio de Sesión</h3>

                <form id="loginForm">
                    <table border="0">
                        <tr>
                            <td>Email:</td>
                            <td><input type="email" id="email" name="email" required></td>
                        </tr>
                        <tr>
                            <td>Contraseña:</td>
                            <td><input type="password" id="password" name="password" required></td>
                        </tr>
                        <tr>
                            <td colspan="2" align="right">
                                <input type="submit" value="Ingresar">
                            </td>
                        </tr>
                    </table>
                </form>

                <br>
                <font size="2">
                    <a href="register.html">¿No tienes cuenta? Regístrate aquí</a>
                </font>

                <div id="error-message" style="color: red; margin-top: 10px;"></div>

            </td>
        </tr>
    </table>

    <script>
        // 1. Escuchar cuando el usuario envíe el formulario
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue

            // 2. Capturar los datos de los inputs
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            try {
                // 3. Enviar la petición a tu API (el endpoint de tus tests)
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    // 4. PERSISTENCIA: Guardamos el token que vimos en tus tests
                    localStorage.setItem('token', result.data.token);
                    
                    alert('¡Login exitoso!');
                    // 5. Redirigir a la página de éxito
                    window.location.href = 'perfil.html';
                } else {
                    // Mostrar error si las credenciales fallan (401)
                    errorDiv.innerText = result.data?.message || 'Error al iniciar sesión';
                }
            } catch (error) {
                errorDiv.innerText = 'Error de conexión con el servidor';
            }
        });
    </script>

</body>
</html>
